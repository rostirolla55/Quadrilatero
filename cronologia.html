<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Cronologia Ascolti Audio</title>
  
  <!-- Libreria QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <!-- Librerie Firebase JS -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <style>
    body { font-family: sans-serif; padding: 20px; color: #333; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .btn-clear-all { background: #6c757d; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-clear-all:hover { background: #5a6268; }
    
    .history-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    .history-table th, .history-table td { border-bottom: 1px solid #ddd; padding: 12px; text-align: left; }
    .history-row { cursor: pointer; transition: background 0.2s; }
    .history-row:hover { background-color: #f1f1f1; }
    
    .btn-delete-row { background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 3px; cursor: pointer; }
    .btn-delete-row:hover { background: #c82333; }
    
    #qr-container { text-align: center; padding: 40px; background: #fafafa; border: 2px dashed #ccc; border-radius: 8px; margin-top: 20px; }
    #qrcode { display: inline-block; margin-top: 15px; padding: 10px; background: white; border: 1px solid #ddd; }
  </style>
</head>
<body>

  <div class="header-bar">
    <h1>Pagine Ascoltate da Smartphone</h1>
    <!-- Punto E: Pulsante cancellazione completa -->
    <button id="btn-clear" class="btn-clear-all" style="display:none;" onclick="svuotaCronologia()">🗑️ Svuota intera cronologia</button>
  </div>

  <!-- Vista 1: QR Code se non ci sono ancora dati -->
  <div id="qr-container">
    <h2>Sincronizza il tuo Smartphone</h2>
    <p>Inquadra questo QR Code con lo smartphone per collegare la sessione e vedere gli ascolti.</p>
    <div id="qrcode"></div>
  </div>

  <!-- Vista 2: Tabella della Cronologia -->
  <table class="history-table" id="table-container" style="display:none;">
    <thead>
      <tr>
        <th>Data e Ora</th>
        <th>Pagina / Argomento</th>
        <th>Azione</th>
      </tr>
    </thead>
    <tbody id="cronologia-body"></tbody>
  </table>

  <script>
    // 1. Configurazione Firebase (inserisci qui i tuoi dati)
	const firebaseConfig = {
	  apiKey: "AIzaSyBDl1XOHCkARszY5g2A_j4XamL38qsmqOY",
	  authDomain: "sito-turistico-quadrilatero.firebaseapp.com",
	  databaseURL: "https://sito-turistico-quadrilatero-default-rtdb.europe-west1.firebasedatabase.app",
	  projectId: "sito-turistico-quadrilatero",
	  storageBucket: "sito-turistico-quadrilatero.firebasestorage.app",
	  messagingSenderId: "217504750698",
	  appId: "1:217504750698:web:e02c49cb43d57f2a307e13"
	};

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // 2. Generazione / Recupero Token univoco Desktop
    let pairToken = localStorage.getItem('desktop_pair_token');
    if (!pairToken) {
      pairToken = 'PAIR_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('desktop_pair_token', pairToken);
    }

    document.addEventListener('DOMContentLoaded', () => {
      mostraQRCode();
      ascoltaCambiamentiDatabase();
    });

	function mostraQRCode() {
	  // Sostituisci l'IP locale con l'URL effettivo del tuo sito GitHub Pages
	  const baseUrl = "https://rostirolla55.github.io/Quadrilatero/index-it.html"; 
	  const syncUrl = `${baseUrl}?pair=${pairToken}`;
	  
	  document.getElementById('qrcode').innerHTML = '';
	  new QRCode(document.getElementById('qrcode'), {
		text: syncUrl,
		width: 180,
		height: 180
	  });
	}
    // Ascolto in tempo reale dei dati da Firebase
    function ascoltaCambiamentiDatabase() {
      database.ref(`cronologia/${pairToken}`).on('value', (snapshot) => {
        const data = snapshot.val();

        if (!data || Object.keys(data).length === 0) {
          // Nessun dato: Mostra QR Code
          document.getElementById('qr-container').style.display = 'block';
          document.getElementById('table-container').style.display = 'none';
          document.getElementById('btn-clear').style.display = 'none';
          return;
        }

        // Dati presenti: Mostra Tabella
        document.getElementById('qr-container').style.display = 'none';
        document.getElementById('table-container').style.display = 'table';
        document.getElementById('btn-clear').style.display = 'inline-block';

        // Converte l'oggetto Firebase in Array
        let listaAscolti = Object.values(data);

        // Punto B: Ordine decrescente di data
        listaAscolti.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

        renderTabella(listaAscolti);
      });
    }

    function renderTabella(dati) {
      const tbody = document.getElementById('cronologia-body');
      tbody.innerHTML = '';

      dati.forEach(item => {
        const row = document.createElement('tr');
        row.className = 'history-row';

        const dataFormattata = new Date(item.timestamp).toLocaleString('it-IT', {
          day: '2-digit', month: '2-digit', year: 'numeric',
          hour: '2-digit', minute: '2-digit'
        });

        row.innerHTML = `
          <td>${dataFormattata}</td>
          <td><strong>${item.title}</strong></td>
          <td>
            <button class="btn-delete-row" onclick="eliminaRiga(event, '${item.pageId}')">❌ Elimina</button>
          </td>
        `;

        // Punto F & G: Apre la pagina selezionata in una nuova finestra/scheda
        row.addEventListener('click', () => {
          window.open(item.url, '_blank');
        });

        tbody.appendChild(row);
      });
    }

    // Punto D: Cancellazione riga singola
    function eliminaRiga(event, pageId) {
      event.stopPropagation(); // Evita l'apertura della nuova scheda (Punto F)
      if (confirm("Rimuovere questa pagina dalla cronologia?")) {
        database.ref(`cronologia/${pairToken}/${pageId}`).remove();
      }
    }

    // Punto E: Cancellazione completa
    function svuotaCronologia() {
      if (confirm("Sei sicuro di voler cancellare tutta la cronologia?")) {
        database.ref(`cronologia/${pairToken}`).remove();
      }
    }
  </script>
</body>
</html>
